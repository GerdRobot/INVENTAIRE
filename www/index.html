<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventaire & Maintenance</title>
<script src="xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7480;--bd:#dfe3e8;--ac:#1d6fe0;--ok:#1e9e5a;--ko:#d6403a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2328;--tx:#eceff2;--mu:#98a2ad;--bd:#2f363d;--ac:#5b9bf5;--ok:#43c486;--ko:#f06a64}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:90px}
header{padding:16px 16px 8px}h1{font-size:20px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mu)}
.bar{padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.chips{display:flex;gap:6px;padding:0 16px 8px}
.chip{flex:1;padding:8px;border:1px solid var(--bd);background:var(--card);border-radius:20px;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.item{display:flex;gap:10px;align-items:center;margin:8px 16px;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.item img,.ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--bd);flex:none}
.item .m{flex:1;min-width:0}.item .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{font-size:13px;color:var(--mu)}
.ok{color:var(--ok);font-weight:600}.ko{color:var(--ko);font-weight:600}
.item input[type=checkbox]{width:22px;height:22px;flex:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;box-shadow:0 4px 12px #0004}
.exp{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:58px;padding:0 20px;border-radius:29px;border:0;background:var(--card);border:1px solid var(--bd);box-shadow:0 4px 12px #0003;font-weight:600}
.modal{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px;display:none;z-index:5}
.modal.show{display:block}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;margin-top:10px}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--ko)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos div{position:relative}.photos img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.photos button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ko);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
</style>
</head>
<body>
<header><h1>📦 Inventaire & Maintenance</h1></header>
<div class="stats">
<div class="stat"><b id="sT">0</b><span>Total</span></div>
<div class="stat"><b id="sG" class="ok">0</b><span>Bon état</span></div>
<div class="stat"><b id="sB" class="ko">0</b><span>Mauvais état</span></div>
</div>
<div class="bar"><input id="q" type="search" placeholder="Rechercher un matériel…"></div>
<div class="chips">
<button class="chip on" data-f="all">Tous</button>
<button class="chip" data-f="good">Bon état</button>
<button class="chip" data-f="bad">Mauvais état</button>
</div>
<div id="list"></div>
<button class="exp" id="expBtn">⬆ Exporter</button>
<button class="fab" id="add">+</button>

<div class="modal" id="form">
<h2 id="fT" style="margin-top:0">Nouveau matériel</h2>
<label>Nom du matériel</label><input id="fN">
<label>Catégorie / Emplacement</label><input id="fC">
<div class="row">
<div><label>Qté en bon état</label><input id="fG" type="number" min="0" inputmode="numeric" value="0"></div>
<div><label>Qté en mauvais état</label><input id="fB" type="number" min="0" inputmode="numeric" value="0"></div>
</div>
<div class="row">
<div><label>Date d’inventaire</label><input id="fD" type="date"></div>
<div><label>Prochaine maintenance</label><input id="fM" type="date"></div>
</div>
<label>Notes / travaux de maintenance</label><textarea id="fO" rows="3"></textarea>
<label>Photos</label>
<div class="row">
<button class="btn s" id="cam" style="margin:0">📷 Prendre</button>
<button class="btn s" id="gal" style="margin:0">🖼 Galerie</button>
</div>
<input id="fc" type="file" accept="image/*" capture="environment" hidden>
<input id="fg" type="file" accept="image/*" multiple hidden>
<div class="photos" id="ph"></div>
<button class="btn" id="save">Enregistrer</button>
<button class="btn s" id="cancel">Annuler</button>
<button class="btn d" id="del" style="display:none">Supprimer</button>
</div>

<div class="modal" id="exM">
<h2 style="margin-top:0">Exporter</h2>
<p class="sm" id="exInfo"></p>
<button class="btn" id="xX">📊 Fichier Excel (.xlsx)</button>
<button class="btn" id="xH">📄 Page avec photos (.html)</button>
<button class="btn s" id="xS">☑ Tout sélectionner / désélectionner</button>
<button class="btn s" id="xC">Fermer</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let items=[],filter='all',sel=new Set(),editId=null,photos=[];
try{items=JSON.parse(localStorage.getItem('inv')||'[]')}catch(e){items=[]}
function persist(){try{localStorage.setItem('inv',JSON.stringify(items))}catch(e){toast('Stockage plein : supprimez des photos')}}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 const q=$('q').value.toLowerCase();
 let g=0,b=0;items.forEach(i=>{g+=+i.good||0;b+=+i.bad||0});
 $('sT').textContent=g+b;$('sG').textContent=g;$('sB').textContent=b;
 const L=items.filter(i=>(!q||(i.name+' '+i.cat).toLowerCase().includes(q))&&(filter=='all'||(filter=='good'&&i.good>0)||(filter=='bad'&&i.bad>0)));
 $('list').innerHTML=L.length?L.map(i=>`<div class="item" data-id="${i.id}">
 <input type="checkbox" ${sel.has(i.id)?'checked':''} data-c="${i.id}">
 ${i.photos&&i.photos[0]?`<img src="${i.photos[0]}">`:'<div class="ph"></div>'}
 <div class="m"><div class="n">${esc(i.name)}</div>
 <div class="sm">${esc(i.cat)}</div>
 <div class="sm"><span class="ok">${i.good} bon</span> · <span class="ko">${i.bad} mauvais</span> · ${esc(i.date)}</div></div></div>`).join(''):'<div class="empty">Aucun matériel. Appuyez sur + pour en ajouter.</div>';
}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==c));render()});
$('q').oninput=render;
$('list').onclick=e=>{
 const c=e.target.closest('[data-c]');
 if(c){c.checked?sel.add(c.dataset.c):sel.delete(c.dataset.c);return}
 const it=e.target.closest('.item');if(it)openForm(it.dataset.id);
};
function renderPh(){$('ph').innerHTML=photos.map((p,k)=>`<div><img src="${p}"><button data-k="${k}">×</button></div>`).join('')}
$('ph').onclick=e=>{const k=e.target.dataset.k;if(k!=null){photos.splice(+k,1);renderPh()}};
function openForm(id){
 editId=id||null;const i=items.find(x=>x.id==id)||{};
 $('fT').textContent=id?'Modifier le matériel':'Nouveau matériel';
 $('fN').value=i.name||'';$('fC').value=i.cat||'';$('fG').value=i.good??0;$('fB').value=i.bad??0;
 $('fD').value=i.date||today();$('fM').value=i.next||'';$('fO').value=i.notes||'';
 photos=[...(i.photos||[])];renderPh();$('del').style.display=id?'block':'none';
 $('form').classList.add('show');scrollTo(0,0);
}
$('add').onclick=()=>openForm();
$('cancel').onclick=()=>$('form').classList.remove('show');
$('cam').onclick=()=>$('fc').click();$('gal').onclick=()=>$('fg').click();
function shrink(file){return new Promise(r=>{const im=new Image,u=URL.createObjectURL(file);
 im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.65))};im.onerror=()=>r(null);im.src=u})}
async function addFiles(inp){for(const f of inp.files){const d=await shrink(f);if(d)photos.push(d)}inp.value='';renderPh()}
$('fc').onchange=()=>addFiles($('fc'));$('fg').onchange=()=>addFiles($('fg'));
$('save').onclick=()=>{
 const name=$('fN').value.trim();if(!name){toast('Entrez un nom');return}
 const o={id:editId||String(Date.now()),name,cat:$('fC').value.trim(),good:Math.max(0,+$('fG').value||0),bad:Math.max(0,+$('fB').value||0),
 date:$('fD').value||today(),next:$('fM').value,notes:$('fO').value.trim(),photos};
 const k=items.findIndex(x=>x.id==o.id);k>=0?items[k]=o:items.unshift(o);
 persist();$('form').classList.remove('show');render();
};
$('del').onclick=()=>{if(confirm('Supprimer ce matériel ?')){items=items.filter(x=>x.id!=editId);sel.delete(editId);persist();$('form').classList.remove('show');render()}};

function target(){return sel.size?items.filter(i=>sel.has(i.id)):items}
function info(){$('exInfo').textContent=sel.size?sel.size+' matériel(s) sélectionné(s) seront exportés.':'Aucune sélection : tout l’inventaire ('+items.length+') sera exporté. Cochez des cases dans la liste pour choisir.'}
$('expBtn').onclick=()=>{info();$('exM').classList.add('show')};
$('xC').onclick=()=>$('exM').classList.remove('show');
$('xS').onclick=()=>{sel.size?sel.clear():items.forEach(i=>sel.add(i.id));render();info()};
async function save(filename,data){
 try{
  const blob=data instanceof Blob?data:new Blob([data],{type:'text/html'});
  const b64=await new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.onerror=j;f.readAsDataURL(blob)});
  const P=window.Capacitor&&Capacitor.Plugins;
  if(!P||!P.Filesystem||!P.Share){toast('Export indisponible');return}
  const w=await P.Filesystem.writeFile({path:filename,data:b64,directory:'CACHE'});
  await P.Share.share({title:filename,url:w.uri,dialogTitle:'Envoyer / enregistrer'});
 }catch(e){if(!/cancel/i.test(String(e&&e.message)))toast('Échec export')}}
$('xX').onclick=()=>{
 const T=target();if(!T.length){toast('Rien à exporter');return}
 const rows=T.map(i=>({'Matériel':i.name,'Catégorie':i.cat,'Qté bon état':i.good,'Qté mauvais état':i.bad,'Total':i.good+i.bad,'Date inventaire':i.date,'Prochaine maintenance':i.next,'Notes':i.notes}));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Inventaire');
 const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
 save('inventaire_'+today()+'.xlsx',new Blob([buf]));
};
$('xH').onclick=()=>{
 const T=target();if(!T.length){toast('Rien à exporter');return}
 const h=`<!DOCTYPE html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventaire ${today()}</title><style>body{font-family:sans-serif;max-width:800px;margin:auto;padding:16px}.c{border:1px solid #ccc;border-radius:10px;padding:12px;margin:12px 0}img{width:140px;height:140px;object-fit:cover;border-radius:8px;margin:4px}.g{color:#1e9e5a}.b{color:#d6403a}</style><h1>Inventaire — ${today()}</h1>`+
 T.map(i=>`<div class="c"><h3>${esc(i.name)}</h3><p>${esc(i.cat)}</p><p><b class="g">Bon état : ${i.good}</b> · <b class="b">Mauvais état : ${i.bad}</b></p><p>Inventaire : ${esc(i.date)}${i.next?' · Prochaine maintenance : '+esc(i.next):''}</p>${i.notes?'<p>'+esc(i.notes)+'</p>':''}${(i.photos||[]).map(p=>`<img src="${p}">`).join('')}</div>`).join('');
 save('inventaire_'+today()+'.html',h);
};
render();
</script>
</body>
</html>
